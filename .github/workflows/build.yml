name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    permissions:
      contents: write # publish releases on v* tags

    steps:
      - name: Install packaging tools
        run: apk add --no-cache zip

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `git describe` sees tags

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/build.sh

      - name: Package
        id: package
        run: |
          PKG="pocketwatch-$(cat plugin/.version)"
          mkdir -p "dist/$PKG/seplugins/pocketwatch"
          cp plugin/pocketwatch.prx "dist/$PKG/seplugins/pocketwatch/"
          cp README.md LICENSE "dist/$PKG/"
          (cd dist && zip -r "$PKG.zip" "$PKG")
          echo "name=$PKG" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.package.outputs.name }}.zip
          generate_release_notes: true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 344" width="960" height="688" font-family="sans-serif">
  <title>PROPOSED: state list in the Saved Data Utility layout</title>
  <!-- SPDX-License-Identifier: GPL-3.0-or-later. Pocketwatch concept, not a screenshot.
       Layout constants from PPSSPP PSPSaveDialog.cpp (docs/research/m4-native-look.md section 3c). -->
  <defs>
    <linearGradient id="shot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a3d6b"/>
      <stop offset="1" stop-color="#1f2f45"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6d9b"/>
      <stop offset="1" stop-color="#2f4f75"/>
    </linearGradient>
  </defs>
  <!-- background: the selected state's screenshot (PIC1 behaviour) -->
  <rect width="480" height="272" fill="url(#shot)"/>
  <text x="330" y="80" text-anchor="middle" font-size="9" fill="#fff" opacity="0.35">selected state's screenshot (PIC1)</text>
  <rect width="480" height="272" fill="#000" opacity="0.35"/>

  <!-- banner y 0-23, title at (30,11) -->
  <rect width="480" height="23" fill="#585863" opacity="0.4"/>
  <text x="30" y="16" font-size="14" fill="#fff">Load State</text>

  <!-- icon column: above the selection 97-13-45k, selected 144x80 at (27,97), below 97+48+45k -->
  <rect x="58.5" y="39" width="81" height="45" fill="#000"/>
  <rect x="58.5" y="39" width="81" height="45" fill="url(#thumb)" opacity="0.7"/>
  <rect x="27" y="97" width="144" height="80" fill="#000"/>
  <rect x="27" y="97" width="144" height="80" fill="url(#thumb)"/>
  <rect x="27" y="97" width="144" height="80" fill="none" stroke="#fff" stroke-opacity="0.82" stroke-width="1.2"/>
  <text x="99" y="141" text-anchor="middle" font-size="9" fill="#fff" opacity="0.8">ICON0 144x80</text>
  <rect x="58.5" y="193" width="81" height="45" fill="#000"/>
  <rect x="58.5" y="193" width="81" height="45" fill="url(#thumb)" opacity="0.7"/>

  <!-- details pane: rule from (180,136), title bottom-aligned at 136, date/size below -->
  <text x="180" y="133" font-size="12" fill="#c0c0c0">Castlevania: The Dracula X Chronicles</text>
  <line x1="180" y1="136.5" x2="480" y2="136.5" stroke="#fff" stroke-width="1"/>
  <text x="180" y="150" font-size="11" fill="#fff">2026/10/16  14:05      14.2 MB</text>
  <text x="175" y="171" font-size="13" fill="#fff">Save State 3</text>
  <text x="175" y="192" font-size="11" fill="#fff">Stage 2 · Clock Tower</text>
  <text x="175" y="206" font-size="11" fill="#fff">Saved with Pocketwatch</text>

  <!-- hint bar: icons x 183.5 / 261.5 at y 256, labels x+14.5 (button order per system setting) -->
  <g font-size="11" fill="#fff">
    <circle cx="189" cy="256" r="5.5" fill="none" stroke="#fff" stroke-width="1.2"/>
    <path d="M186 253 l6 6 M192 253 l-6 6" stroke="#fff" stroke-width="1.2"/>
    <text x="198" y="260">Enter</text>
    <circle cx="267" cy="256" r="5.5" fill="none" stroke="#fff" stroke-width="1.2"/>
    <circle cx="267" cy="256" r="2.6" fill="none" stroke="#fff" stroke-width="1.2"/>
    <text x="276" y="260">Back</text>
    <text x="330" y="260" opacity="0.85">△ Options</text>
  </g>

  <rect y="272" width="480" height="72" fill="#f4f4f4"/>
  <rect x="6" y="278" width="78" height="14" rx="3" fill="#c0392b"/>
  <text x="45" y="288.5" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">PROPOSED · M5</text>
  <text x="92" y="289" font-size="9.5" fill="#222">State list = the Saved Data Utility: icon column, details pane, banner, hints.</text>
  <text x="8" y="306" font-size="8.5" fill="#444">Each slot is a real SAVEDATA folder (ICON0/PIC1/PARAM.SFO), so the XMB shows the same data natively.</text>
  <text x="8" y="320" font-size="8.5" fill="#444">Save mode adds "New Save State" at the top; △ Options = Delete. Button pictures from system_plugin_fg.rco.</text>
  <text x="8" y="334" font-size="8.5" fill="#444">Not implemented: today states live only in RAM (one state, single use).</text>
</svg>

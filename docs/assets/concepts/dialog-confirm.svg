<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 344" width="960" height="688" font-family="sans-serif">
  <title>PROPOSED: confirmation dialog in the system message-dialog style</title>
  <!-- SPDX-License-Identifier: GPL-3.0-or-later. Pocketwatch concept, not a screenshot.
       Layout from PPSSPP PSPDialog.cpp (white rules x 60-420 around centred text, Yes x 204, No x 273). -->
  <defs>
    <linearGradient id="game" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4f6b"/>
      <stop offset="0.5" stop-color="#6b4a3a"/>
      <stop offset="1" stop-color="#2d3b2a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-30%" width="130%" height="180%">
      <feDropShadow dx="1" dy="2" stdDeviation="0.8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="480" height="272" fill="url(#game)"/>
  <rect width="480" height="272" fill="#000" opacity="0.62"/>

  <line x1="60" y1="98.5" x2="420" y2="98.5" stroke="#fff" stroke-width="1"/>
  <g filter="url(#shadow)" fill="#fff" text-anchor="middle">
    <text x="240" y="126" font-size="13">Load this state?</text>
    <text x="240" y="144" font-size="13">Progress since the save will be lost.</text>
  </g>
  <rect x="258" y="153" width="30" height="16" fill="#cfcfcf" opacity="0.43"/>
  <g filter="url(#shadow)" fill="#fff" text-anchor="middle" font-size="13">
    <text x="204" y="165">Yes</text>
    <text x="273" y="165">No</text>
  </g>
  <line x1="60" y1="177.5" x2="420" y2="177.5" stroke="#fff" stroke-width="1"/>

  <g font-size="11" fill="#fff">
    <circle cx="189" cy="256" r="5.5" fill="none" stroke="#fff" stroke-width="1.2"/>
    <path d="M186 253 l6 6 M192 253 l-6 6" stroke="#fff" stroke-width="1.2"/>
    <text x="198" y="260">Enter</text>
    <circle cx="267" cy="256" r="5.5" fill="none" stroke="#fff" stroke-width="1.2"/>
    <circle cx="267" cy="256" r="2.6" fill="none" stroke="#fff" stroke-width="1.2"/>
    <text x="276" y="260">Back</text>
  </g>

  <rect y="272" width="480" height="72" fill="#f4f4f4"/>
  <rect x="6" y="278" width="78" height="14" rx="3" fill="#c0392b"/>
  <text x="45" y="288.5" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">PROPOSED</text>
  <text x="92" y="289" font-size="9.5" fill="#222">Confirmation in the system message-dialog style; No is the default for destructive actions.</text>
  <text x="8" y="306" font-size="8.5" fill="#444">Used for Load State, overwrite, Delete and Quit Game. Same layout shows refusals ("cannot be loaded: ...") with OK.</text>
  <text x="8" y="320" font-size="8.5" fill="#444">Dim, fade 200 ms, selection box 0x6DCFCFCF from PPSSPP (to verify against a device capture).</text>
  <text x="8" y="334" font-size="8.5" fill="#444">Today: a one-line status text in the phase-1 menu instead of dialogs.</text>
</svg>

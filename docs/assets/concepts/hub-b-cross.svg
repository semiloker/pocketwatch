<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 344" width="960" height="688" font-family="sans-serif">
  <title>PROPOSED concept B: XMB cross hub (complications as categories)</title>
  <!-- SPDX-License-Identifier: GPL-3.0-or-later. Pocketwatch concept, not a screenshot.
       Category pitch 80 px (+5 px around the open one), metrics INFERRED from VitaXMB. -->
  <defs>
    <linearGradient id="game" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4f6b"/>
      <stop offset="0.5" stop-color="#6b4a3a"/>
      <stop offset="1" stop-color="#2d3b2a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-30%" width="130%" height="180%">
      <feDropShadow dx="2" dy="2" stdDeviation="1.2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="480" height="272" fill="url(#game)"/>
  <text x="240" y="250" text-anchor="middle" font-size="9" fill="#fff" opacity="0.35">frozen game frame</text>
  <rect width="480" height="272" fill="#000" opacity="0.62"/>

  <!-- category bar: Game (left, dim), States (open), Settings (right, dim) -->
  <g filter="url(#shadow)">
    <g opacity="0.65" transform="translate(24 70)">
      <rect x="-20" y="-13" width="40" height="26" rx="10" fill="none" stroke="#fff" stroke-width="2.6"/>
      <circle cx="-9" cy="0" r="3" fill="#fff"/><circle cx="9" cy="0" r="3" fill="#fff"/>
    </g>
    <text x="24" y="100" text-anchor="middle" font-size="10" fill="#fff" opacity="0.65">Game</text>
    <g transform="translate(109 70)">
      <circle r="22" fill="none" stroke="#fff" stroke-width="3"/>
      <line x1="0" y1="0" x2="0" y2="-14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="10" y2="5" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="109" y="106" text-anchor="middle" font-size="12" fill="#fff">States</text>
    <g opacity="0.65" transform="translate(194 70)">
      <circle r="14" fill="none" stroke="#fff" stroke-width="2.6"/><circle r="5" fill="#fff"/>
    </g>
    <text x="194" y="100" text-anchor="middle" font-size="10" fill="#fff" opacity="0.65">Settings</text>
  </g>

  <!-- items of the open category -->
  <g filter="url(#shadow)">
    <rect x="80" y="117" width="48" height="36" rx="5" fill="none" stroke="#fff" stroke-width="3"/>
    <line x1="104" y1="124" x2="104" y2="144" stroke="#fff" stroke-width="3"/>
    <polyline points="96,136 104,144 112,136" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="150" y="134" font-size="15" fill="#fff">Save State</text>
    <text x="150" y="150" font-size="11" fill="#fff" opacity="0.85">3 of 10 slots used</text>
  </g>
  <g filter="url(#shadow)" opacity="0.8">
    <rect x="86" y="178" width="36" height="28" rx="4" fill="none" stroke="#fff" stroke-width="2.4"/>
    <line x1="104" y1="198" x2="104" y2="184" stroke="#fff" stroke-width="2.4"/>
    <polyline points="98,190 104,184 110,190" fill="none" stroke="#fff" stroke-width="2.4"/>
    <text x="150" y="197" font-size="14" fill="#fff">Load State</text>
  </g>

  <rect y="272" width="480" height="72" fill="#f4f4f4"/>
  <rect x="6" y="278" width="78" height="14" rx="3" fill="#c0392b"/>
  <text x="45" y="288.5" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">PROPOSED · B</text>
  <text x="92" y="289" font-size="9.5" fill="#222">Cross: each complication is a category; Left/Right = categories, Up/Down = items.</text>
  <text x="8" y="306" font-size="8.5" fill="#444">Game = Resume Game, Quit Game · States = Save/Load · Settings = Pocketwatch options · pitch 80 px, 200 ms slide</text>
  <text x="8" y="320" font-size="8.5" fill="#444">Worth it once several complications exist; for v0.1 concept A is recommended (fewer moves to every action).</text>
  <text x="8" y="334" font-size="8.5" fill="#444">Icons are placeholders; text sizes as in concept A.</text>
</svg>
